[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codewam"
version = "0.1.0"
description = "CodeWAM: an independent world-action model with frozen multi-scale RQ state codes."
requires-python = ">=3.10"
dependencies = [
  "torch",
  "numpy",
  "einops",
  "omegaconf",
  "hydra-core",
  "pillow",
]

[project.optional-dependencies]
bootstrap = [
  "huggingface-hub",
  "modelscope",
  "safetensors",
]
local-dev = [
  "accelerate",
  "imageio",
  "imageio-ffmpeg",
  "torchvision",
  "transformers",
]
language-export = [
  "safetensors>=0.4.3",
  "sentencepiece==0.2.0",
  "transformers==4.57.6",
]
droid = [
  "tensorflow-cpu==2.21.0",
  "tensorflow-datasets==4.9.10",
]
dev = [
  "ruff",
  "pytest",
]

# NOTE: The canonical CodeWAM model is independent of FastWAM. The external
# package remains optional for the F0 baseline and legacy Wan export/runtime.

[tool.setuptools.packages.find]
include = ["codewam*"]
