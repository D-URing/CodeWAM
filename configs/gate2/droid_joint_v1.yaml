# Gate 2 is a controlled dynamics probe, not the final policy training recipe.
chart_name: droid
seed: 20260730

batch_size: 16
eval_batch_size: 32
epochs: 10
max_steps: null
learning_rate: 3.0e-4
weight_decay: 1.0e-2
grad_clip_norm: 1.0
num_workers: 4

device: cuda
amp_dtype: bfloat16
calibration_bins: 15
bootstrap_samples: 2000
minimum_gate_episodes: 30

model:
  variant: C2
  dynamics_mode: independent
  latent_channels: 48
  proprio_dim: 14
  action_dim: 7
  language_dim: 1
  dim: 256
  heads: 8
  patch_size: 2
  max_time: 8
  max_cameras: 2
  max_spatial_tokens: 1024
  max_action_horizon: 16
  state_spatial_layers: 2
  state_temporal_layers: 2
  belief_queries: 8
  belief_layers: 3
  action_layers: 1
  dynamics_layers: 3
  dynamics_action_layers: 1
  dropout: 0.0
  lambda_code: 1.0
